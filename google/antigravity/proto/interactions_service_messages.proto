edition = "2023";

package genai;

import "google/api/httpbody.proto";
import "google/antigravity/proto/interaction.proto";
import "google/antigravity/proto/genai_json_annotations.proto";

message CreateInteractionHttpRequest {
  .google.api.HttpBody http_body = 2;
}
message CreateInteractionRequest {
  bool stream = 1;
  bool store = 2;
  .genai.Interaction interaction = 3
      [(gaos.parsing.subtype_source_field) = true];
  bool background = 4;
}
message GetInteractionRequest {
  string name = 1;
  bool stream = 2;
  string last_event_id = 3;
  bool include_input = 4;
}
message DeleteInteractionRequest {
  string name = 1;
}
message CancelInteractionRequest {
  string name = 1;
}
message SendInteractionHttpRequest {
  string name = 1;
  .google.api.HttpBody http_body = 2;
  bool stream = 3;
}
message CompleteInteractionRequest {
  string name = 1;
}
